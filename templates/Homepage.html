<!DOCTYPE html>
<html lang="en">
    <head>
        {% load static %}

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Home</title>
        <link rel="stylesheet" href="{%static 'basic.css'%}">
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
            }
            .container {
                height: 100%; 
                display: grid;
                padding: 0px;
                grid-template-columns: 1fr 5fr;
                grid-template-rows: 100px 40px auto 40px; 
            }

            .header {
                grid-column: 1 / 3;
                color: white;
                font-size: 90%;
            }

            .menu {
                grid-column: 1/-1;
                grid-row: 2;
                color: white;
                font-size: 80%;
                text-shadow: 0 0 5px black;
            }

            a {
                color: white;
                text-decoration: none;
            }

            a:hover {
                color: #f896ad;
                font-size: 110%;
            }

            .content {
                grid-column: 1 / -1;
                /* grid-row: ; */
            }

            .footer {
                grid-column: 1 / 3;
            }

        </style>
    </head>
    <body>
        <div class="container">
            <div class="header"><h1 class="Heading">Online Restaurant</h1></div>
            <div class="menu">
                <a href="#" style="padding-right : 20px;">Menu    </a>
                <a href="#" style="padding-right : 20px; padding-left : 20px;">Cart    </a>
                <a href="#" style="padding-right : 20px; padding-left : 20px;">About Us    </a>
                <a href="#" id="loginLink" data-toggle="modal" data-target="#loginModal" style="padding-right : 20px; padding-left : 20px;">Login    </a>
                <a href="#" id="signupLink" data-toggle="modal" data-target="#signupModal" style="padding-right : 20px; padding-left : 20px;">Sign Up</a>
            </div>
            <div class="content">CONTENT</div>
            <div class="footer">FOOTER</div>
        </div>
    </body>
</html>
